version: 0.2

# All CI on CodeBuild
# PR webhook: ordered gate (typecheck → unit → http → infra → synth → preflight → live)
# main PUSH: deploy if infra/ changed, then the same gate
# Cognito config (incl. client secret) loaded from Secrets Manager in pre_build
# TOTP soak is not part of this required gate (see test:soak:totp / ticket 12)

env:
  variables:
    STACK_NAME: CognitoHarnessStack
    COGNITO_CONFIG_SECRET_NAME: cognito-test-harness/cognito
    NODE_OPTIONS: --max-old-space-size=4096

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - node -v
      - npm ci
      - npm ci --prefix infra

  pre_build:
    commands:
      - chmod +x scripts/codebuild-pre-build.sh scripts/ci-gate.sh
      - ./scripts/codebuild-pre-build.sh

  build:
    commands:
      - npm run ci:gate

cache:
  paths:
    - node_modules/**/*
    - infra/node_modules/**/*
