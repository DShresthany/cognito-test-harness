version: 0.2

# Phase 6 — all CI on CodeBuild
# PR webhook: Jest + synth + unit + Cognito npm test (no deploy)
# main PUSH: deploy if infra/ changed, then the same checks

env:
  variables:
    STACK_NAME: CognitoHarnessStack
    NODE_OPTIONS: --max-old-space-size=4096

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - node -v
      - npm ci
      - npm ci --prefix infra

  pre_build:
    commands:
      - chmod +x scripts/codebuild-pre-build.sh
      - ./scripts/codebuild-pre-build.sh

  build:
    commands:
      - npm run infra:test
      - npm run infra:synth
      - npm run test:unit
      - npm test

cache:
  paths:
    - node_modules/**/*
    - infra/node_modules/**/*
