version: 0.2

# Phase 6 — all CI on CodeBuild
# PR webhook: Jest + synth + unit + Cognito npm test (no deploy)
# main PUSH: deploy if infra/ changed, then the same checks

env:
  variables:
    STACK_NAME: CognitoHarnessStack
    NODE_OPTIONS: --max-old-space-size=4096

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - node -v
      - npm ci
      - npm ci --prefix infra

  pre_build:
    commands:
      - |
        set -euo pipefail
        export AWS_REGION="${AWS_REGION:-$AWS_DEFAULT_REGION}"
        export CDK_DEFAULT_ACCOUNT
        CDK_DEFAULT_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
        export CDK_DEFAULT_REGION="${AWS_REGION}"
        echo "Account=${CDK_DEFAULT_ACCOUNT} Region=${AWS_REGION}"
        echo "Webhook event=${CODEBUILD_WEBHOOK_EVENT:-none} head=${CODEBUILD_WEBHOOK_HEAD_REF:-none}"

        # On main push, deploy Cognito/CDK stack when infra/ changed.
        if [ "${CODEBUILD_WEBHOOK_EVENT:-}" = "PUSH" ] && \
           [ "${CODEBUILD_WEBHOOK_HEAD_REF:-}" = "refs/heads/main" ]; then
          BEFORE="${CODEBUILD_WEBHOOK_PREV_COMMIT:-}"
          AFTER="${CODEBUILD_RESOLVED_SOURCE_VERSION:-}"
          if [ -n "${BEFORE}" ] && [ -n "${AFTER}" ] && \
             git diff --name-only "${BEFORE}" "${AFTER}" | grep -q '^infra/'; then
            echo "infra/ changed on main — deploying stack"
            npm run infra:deploy
          else
            echo "No infra/ deploy needed on this main push"
          fi
        else
          echo "Skipping deploy (not a main PUSH)"
        fi

        # Cognito env from live stack outputs (stays aligned after redeploy).
        OUTPUTS="$(aws cloudformation describe-stacks \
          --stack-name "${STACK_NAME}" \
          --query 'Stacks[0].Outputs' \
          --output json)"
        export COGNITO_USER_POOL_ID
        export COGNITO_CLIENT_ID
        export COGNITO_CLIENT_SECRET
        COGNITO_USER_POOL_ID="$(echo "${OUTPUTS}" | jq -r '.[] | select(.OutputKey=="UserPoolId") | .OutputValue')"
        COGNITO_CLIENT_ID="$(echo "${OUTPUTS}" | jq -r '.[] | select(.OutputKey=="UserPoolClientId") | .OutputValue')"
        COGNITO_CLIENT_SECRET="$(echo "${OUTPUTS}" | jq -r '.[] | select(.OutputKey=="UserPoolClientSecret") | .OutputValue')"
        AWS_REGION="$(echo "${OUTPUTS}" | jq -r '.[] | select(.OutputKey=="Region") | .OutputValue')"
        export AWS_REGION

        for var in COGNITO_USER_POOL_ID COGNITO_CLIENT_ID COGNITO_CLIENT_SECRET AWS_REGION; do
          eval "val=\${$var}"
          if [ -z "${val}" ] || [ "${val}" = "null" ]; then
            echo "Missing stack output mapped to ${var}"
            exit 1
          fi
        done
        echo "Loaded Cognito config from ${STACK_NAME} outputs"

  build:
    commands:
      - npm run infra:test
      - npm run infra:synth
      - npm run test:unit
      - npm test

cache:
  paths:
    - node_modules/**/*
    - infra/node_modules/**/*
