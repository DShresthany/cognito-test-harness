version: 0.2

# All CI on CodeBuild
# PR webhook: Jest + synth + unit + Cognito npm test (no deploy)
# main PUSH: deploy if infra/ changed, then the same checks
# Cognito config (incl. client secret) loaded from Secrets Manager in pre_build

env:
  variables:
    STACK_NAME: CognitoHarnessStack
    COGNITO_CONFIG_SECRET_NAME: cognito-test-harness/cognito
    NODE_OPTIONS: --max-old-space-size=4096
    # Needed so `cdk synth` in CI can instantiate the stack (not used for live alerts).
    ALERT_EMAIL: codebuild-synth-placeholder@example.com

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - node -v
      - npm ci
      - npm ci --prefix infra

  pre_build:
    commands:
      - chmod +x scripts/codebuild-pre-build.sh
      - ./scripts/codebuild-pre-build.sh

  build:
    commands:
      # TEMP: intentional fail to smoke-test SNS history URL — revert after
      - echo "INTENTIONAL CI FAIL for SNS alert smoke" && exit 1
      - npm run infra:test
      - npm run infra:synth
      - npm run test:unit
      - npm test

cache:
  paths:
    - node_modules/**/*
    - infra/node_modules/**/*
